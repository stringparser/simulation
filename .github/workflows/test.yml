name: test

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: ising-sim

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ising-sim/package-lock.json
      - run: npm ci
      - run: npm test -- --passWithNoTests
      - run: npm run build
